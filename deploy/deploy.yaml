version: "2.0"

services:
  vllm:
    image: ghcr.io/toxmon/akashlocalllm:main
    env:
      - "PORT=8000"
      # REQUIRED
      - "MODEL=Qwen/Qwen2.5-7B-Instruct"
      # OPTIONAL (gated models)
      # - "HF_TOKEN=__SET_ME__"
      # Qwen2.5-7B supports 128K via RoPE scaling; override flag needed
      - "VLLM_ALLOW_LONG_MAX_MODEL_LEN=1"
      - "VLLM_ARGS=--max-model-len 131072"
      # Persist HF cache on Akash
      - "HF_HOME=/data/hf"
      - "HF_HUB_CACHE=/data/hf/hub"
      - "TRANSFORMERS_CACHE=/data/hf/transformers"
    params:
      storage:
        data:
          mount: /data
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
        # Optional custom host (uncomment and set HOST env var if you want domain routing)
        # accept:
        #   - "llm.yourdomain.com"

profiles:
  compute:
    vllm:
      resources:
        cpu:
          units: 8
        memory:
          size: 64Gi
        storage:
          - name: data
            size: 100Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                # T4 is common/cheap; adjust if you bid A10/A100 etc
                - model: t4

  placement:
    dcloud:
      pricing:
        vllm:
          denom: uact
          amount: 10000

deployment:
  vllm:
    dcloud:
      profile: vllm
      count: 1
